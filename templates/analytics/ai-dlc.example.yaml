# Analytics AI-DLC 프로젝트별 설정 예시
# 대상 저장소 루트에 ai-dlc.yaml로 복사한다.
# [변경 필요] 값은 교체하고 [확인 필요] 항목은 실제 환경과 대조한다.
# 설정과 운영 절차의 변경은 사용자 승인을 받은 별도 유지보수에서 수행한다.

schema_version: 2

# [변경 필요] services의 키와 일치하는 실제 서비스 식별자
active_service: example

services:
  example:
    repositories:
      # [변경 필요] Analytics 저장소와 기준 브랜치
      analytics:
        enabled: true
        repository: example-user/example-analytics
        default_branch: main

      # [선택] 공식 요구사항이나 계약을 다른 저장소에서 참조하는 경우
      # common:
      #   enabled: true
      #   repository: example-user/example-specs
      #   default_branch: main

    # 생략 시 github_projects. 설정한 도구의 연결에 실패하면 작업을 보류한다.
    work_tracking:
      provider: github_projects

    # Jira 사용 시 provider를 jira로 바꾸고 실제 값으로 설정한 뒤 주석을 해제한다.
    # jira:
    #   site_url: https://example.atlassian.net
    #   project_key: EXAMPLE
    #   issue_types:
    #     implementation: Task
    #     candidate: Task
    #     epic: Epic
    #     contract: Task
    #   statuses:
    #     candidate: 아이디어 후보
    #     backlog: 할 일
    #     ready: 착수 가능
    #     in_progress: 진행 중
    #     in_review: 검토 중
    #     done: 완료
    #   role_labels:
    #     analytics: 'area:analytics'
    #     specs: 'area:specs' # 공식 계약 Task를 추적하는 경우
    #   approval: user_transition_to_backlog
    #   priority_order: [Highest, High, Medium, Low, Lowest]

    # GitHub Projects 사용 시 [변경 필요] 실제 Project 식별 정보
    project:
      owner: example-user
      number: 1
      id: REPLACE_WITH_PROJECT_ID
      url: https://github.com/users/example-user/projects/1

      # [확인 필요] 실제 Project 필드와 상태·우선순위 선택지
      fields:
        status: Status
        approval: Approval
        proposer: Proposer
        candidate_id: Candidate ID
        priority: Priority
        target_date: Target date
      statuses:
        backlog: Backlog
        ready: Ready
        in_progress: In Progress
        in_review: In Review
        done: Done
      approval_values:
        pending: Pending
        approved: Approved
      proposer_values:
        user: User
        ai: AI
      priority_values:
        high: High
        medium: Medium
        low: Low

    # [확인 필요] Analytics 저장소에서 사용하는 GitHub Issue 라벨
    labels:
      decision: 'needs: decision'
      priority:
        high: 'priority: high'
        medium: 'priority: medium'
        low: 'priority: low'

    # [선택] 적용되는 공식 원본의 저장소 역할·경로·형식
    # 원본 저장소를 repositories에 설정하고, 역할 키를 연결한다.
    # requirements:
    #   repository_role: common
    #   path: docs/requirements.md
    #   format: markdown
    # contracts:
    #   api:
    #     repository_role: common
    #     path: docs/openapi.yaml
    #     format: openapi

    # [확인 필요] 작업 브랜치 규칙과 대상 저장소의 실제 검증 명령
    development:
      branch_pattern: 'codex/작업키-또는-이슈번호-작업명'
      branch_prefix: 'codex/'
      protected_branches:
        - main
      test_command: 'python -m pytest'
      test_command_windows: 'python -m pytest'

# 적용 전 active_service와 저장소·기준 브랜치·원격을 대조한다.
# GitHub Projects는 Project 필드·선택지와 Issue 라벨을 확인한다.
# Jira는 사이트·프로젝트·구현 유형·상태·역할 라벨·우선순위를 확인한다.
# 적용되는 공식 원본의 경로와 권한, 대상 환경의 검증 명령을 확인한다.
# 토큰, 비밀번호, API 키는 기록하지 않는다.
