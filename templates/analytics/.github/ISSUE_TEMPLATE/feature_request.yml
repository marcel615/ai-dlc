name: Analytics 작업
description: 데이터 처리나 분석 기능의 추가 또는 개선을 요청한다.
body:
  - type: textarea
    id: goal
    attributes:
      label: 배경과 목표
      description: 현재 상황과 해결할 문제, 기대하는 산출물을 적는다.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 범위와 입력
      description: 변경할 처리 흐름과 적용 범위, 필요한 입력과 제약을 적는다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 검증
      description: 기대 결과와 이를 확인할 방법을 적는다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 공식 원본과 선행 작업
      description: 작업에 적용되는 요구사항·계약 및 선행 작업 링크를 적는다.
